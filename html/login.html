<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="login">
    <div id="menu"></div>

    <main>
        <section class="caja login">
            <h1>Iniciar sesión</h1>
            <p>Este formulario valida el usuario con el archivo usuarios.xml.</p>

            <form id="formLogin" class="formulario">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>

                <button type="submit">Entrar</button>
            </form>
            <p id="mensajeLogin"></p>

            <p><strong>Prueba:</strong> angel / 12345</p>
        </section>
    </main>

    <div id="pie"></div>
    <script src="../jvS/componentes.js"></script>
    <script src="../jvS/app.js"></script>
</body>
</html>
