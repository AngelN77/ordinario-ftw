<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="contacto">

    <div id="menu"></div>

    <h1>Contacto</h1>
    <p>Llena el formulario para mandar un mensaje.</p>

    <form id="formContacto">
        <p>Nombre:</p>
        <input type="text" id="nombreContacto">

        <p>Correo:</p>
        <input type="email" id="correoContacto">

        <p>Tipo de pedido:</p>
        <input type="radio" name="tipo" value="normal"> Normal
        <input type="radio" name="tipo" value="urgente"> Urgente

        <p>Mensaje:</p>
        <textarea id="mensajeContacto"></textarea>

        <br><br>
        <button type="submit">Enviar</button>
    </form>

    <p id="mensajeContactoFinal"></p>

    <div id="pie"></div>

    <script src="../jvS/componentes.js"></script>
    <script src="../jvS/app.js"></script>
</body>
</html>
