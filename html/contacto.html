<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="contacto">

    <div id="menu"></div>

    <h1>Contacto</h1>
    <p>En esta pagina puedes mandar un mensaje sobre algun pedido o duda.</p>

    <form id="formContacto">
        <p>Nombre:</p>
        <input type="text" id="nombreContacto">

        <p>Correo:</p>
        <input type="email" id="correoContacto">

        <p>Motivo:</p>
        <input  name="motivo" value=""> 

        <p>Mensaje:</p>
        <textarea id="mensajeContacto"></textarea>

        <br><br>
        <button type="submit">Enviar</button>
    </form>

    <p id="respuestaContacto"></p>

    <div id="pie"></div>
<!-- comentarios pages 2 -->
