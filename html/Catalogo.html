<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de postres</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="catalogo">
    <div id="menu"></div>

    <main>
        <section class="caja">
            <h1>Catálogo</h1>
            <p>Busca postres usando los filtros.</p>

            <form class="formulario" id="formFiltros">
                <label for="buscar">Buscar por nombre:</label>
                <input type="text" id="buscar" placeholder="Ejemplo: flan">

                <label for="categoria">Categoría:</label>
                <select id="categoria">
                    <option value="todos">Todos</option>
                    <option value="Pastel">Pastel</option>
                    <option value="Gelatina">Gelatina</option>
                    <option value="Galleta">Galleta</option>
                    <option value="Flan">Flan</option>
                </select>

                <label for="precio">Precio máximo:</label>
                <input type="range" id="precio" min="20" max="100" value="100">
                <p>Precio seleccionado: $<span id="precioTexto">100</span></p>

                <label class="check">
                    <input type="checkbox" id="sinAzucar"> Solo sin azúcar
                </label>

                <button type="button" id="btnLimpiar">Limpiar filtros</button>
            </form>
        </section>

        <section class="caja">
            <h2>Resultados en tarjetas</h2>
            <div id="listaPostres" class="contenedor-postres"></div>
        </section>

        <section class="caja">
            <h2>Tabla de postres</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Sin azúcar</th>
                    </tr>
                </thead>
                <tbody id="tablaPostres"></tbody>
            </table>
        </section>
    </main>

    <div id="pie"></div>
    <script src="../jvS/componentes.js"></script>
    <script src="../jvS/app.js"></script>
</body>
</html>
