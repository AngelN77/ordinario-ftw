<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="catalogo">

    <div id="menu"></div>

    <h1>Catalogo de postres</h1>
    <p>postres y más, sirvete</p>

    <h2>Filtros</h2>

    <form id="formFiltros">
        <p>Buscar por nombre:</p>
        <input type="text" id="buscar" placeholder="Ejemplo flan">

        <p>Categoria:</p>
        <select id="categoria">
            <option value="todos">Todos</option>
            <option value="Pastel">Pastel</option>
            <option value="Gelatina">Gelatina</option>
            <option value="Galleta">Galleta</option>
            <option value="Flan">Flan</option>
        </select>

        <p>Precio maximo:</p>
        <input type="range" id="precio" min="20" max="100" value="100">
        <p>Precio seleccionado: $<span id="precioTexto">100</span></p>
<!-- rayita para lo deeee el precio cambie, ayuda de ia  -->
        <p>
            <input type="checkbox" id="sinAzucar">
            Solo sin azucar
        </p>

        <button type="button" id="btnLimpiar">Limpiar</button>
    </form>

    <h2>Postres encontrados</h2>
    <div id="listaPostres"></div>

    <h2>Tabla de postres</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Precio</th>
                <th>Sin azucar</th>
            </tr>
        </thead>
        <tbody id="tablaPostres"></tbody>
    </table>

    <div id="pie"></div>
    <!-- comentarios pages -->

    <script src="../jvS/compontns.js"></script>
    <script src="../jvS/app.js"></script>
</body>
</html>
